<div class="nav-item">
    <div class="container">
        <nav class="nav-menu mobile-menu">
            <ul>
                <li class="active"><a routerLink="">Home</a></li>
                
                <li>
                    <div *ngIf="menuType!=='seller'" class="navbar-search">
                        <input #searchInput type="text" (keyup)="searchProduct($event)" (blur)="hideSearch()"
                            placeholder="Search for products">
                        <button (click)="submitSearch(searchInput.value)">Search</button>
                        <ul class="suggested-result" *ngIf="searchProd">
                            <li *ngFor="let search of searchProd">
                                <a (mousedown)="redirectDetails(search.id)">{{search.name}}</a>
                            </li>
                            
                        </ul>
                    </div>
                </li>
                <li><a >Contact</a></li>
                <li><a >About</a></li>
            </ul>
            <ul [ngSwitch]="menuType">
                <div *ngSwitchCase="'default'">
                    <li>
                        <a >Account</a>
                        <ul class="dropdown">
                          <li><a routerLink="seller-auth">Seller Login</a></li>
                          <li><a routerLink="/user-auth">User Login</a></li>
                        </ul>
                      </li>
                </div>
                        <div *ngSwitchCase="'user'">

                            <li>
                                <a routerLink="/">{{userName | titlecase}}</a>
                                <ul class="dropdown">
                                  <li><a routerLink="my-orders">My Orders</a></li>
                                  <li><a (click)="userLogout()">Logout</a></li>
                                  <li><a [routerLink]="cartItems>0?'cart-page':null"> Cart ({{cartItems}})</a></li>
                                </ul>
                              </li>

                            
                            <!-- <li><a routerLink="seller-auth">Seller</a></li> -->


                            
                        </div>
                        <div *ngSwitchCase="'seller'">
                            <li>
                                <a >{{sellerName | titlecase}}</a>
                                <ul class="dropdown">
                                    <li><a routerLink="seller-dashboard">Dashboard</a></li>
                                    <li><a routerLink="seller-add-product">Add Product</a></li>
                                    <li><a routerLink="seller-home">List</a></li>
                                    <li><a (click)="sellerLogout()">Logout</a></li>
                                </ul>
                              </li>
                            
                        </div>


        </ul>
        </nav>
        <div id="mobile-menu-wrap"></div>
    </div>
</div>
