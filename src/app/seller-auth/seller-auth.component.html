<!-- Register Section Begin -->
<div class="register-login-section spad">
    <div class="container">
        <div class="row">
            <div class="col-lg-6 offset-lg-3">
                <div *ngIf="showLogin" class="login-form">
                    <h2>Login</h2>
                   
                        <form #sellerLogin="ngForm" (ngSubmit)="login(sellerLogin.value)" class="common-form">
                            <div class="group-input">
                                <label for="username">Username or email address *</label>
                                <input class="form-input" type="text" name="email" placeholder="Enter email" ngModel #email="ngModel" required email>
                                <p class="invalid-input"><span *ngIf="email.invalid && email.touched">Please enter valid password</span></p>
                               
                            </div>
                            <div class="group-input">
                                <label for="pass">Password *</label>
                                <input class="form-input" type="password" name="password" placeholder="Enter password" ngModel #password="ngModel" minlength="4" maxlength="20" required>
                                <p class="invalid-input"><span *ngIf="password.invalid && password.touched">Enter valid password</span></p>
                                
                            </div>
                        
                        <div class="group-input gi-check">
                            <div class="gi-more">
                                <label for="save-pass">
                                    Save Password
                                    <input type="checkbox" id="save-pass">
                                    <span class="checkmark"></span>
                                </label>
                                <a href="#" class="forget-pass">Forget your Password</a>
                            </div>
                        </div>
                        <button class="site-btn login-btn" [disabled]="sellerLogin.invalid">Login</button>
                    </form>
                    <div class="switch-login">
                        <a  class="or-login" (click)="openSignUp()">Or Create An Account</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<!-- Register Form Section End -->
